name: Welcome First-time Contributors

on:
  pull_request_target:
    types: [opened]

jobs:
  welcome:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Greet Contributor
        uses: actions/github-script@v7
        with:
          script: |
            const creator = context.payload.sender.login;
            const repoOwner = context.repo.owner;
            if (creator === repoOwner) return;

            const message = `👋 Welcome @${creator}! Thank you so much for opening this pull request to **Claude Agent Skills Hub**!\n\n` +
              `Our team reviews and merges community PRs fast (< 24 hours). Once merged, you will be automatically added to our **Contributors Hall of Fame**! 🚀\n\n` +
              `Please ensure you've checked the items in our PR checklist. Happy coding!`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: message
            });
