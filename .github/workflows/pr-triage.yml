name: PR Auto-Triage & Labeler

on:
  pull_request_target:
    types: [opened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Triage PR Files
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const files = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
            });

            const labelsToAdd = new Set();

            for (const f of files.data) {
              const filename = f.filename.toLowerCase();
              if (filename.endsWith('.md') || filename.startsWith('docs/')) {
                labelsToAdd.add('documentation');
              }
              if (filename.includes('skill') || filename.endsWith('skill.md')) {
                labelsToAdd.add('skill');
              }
              if (filename.includes('mcp')) {
                labelsToAdd.add('mcp');
              }
            }

            if (labelsToAdd.size > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: Array.from(labelsToAdd)
              });
            }
